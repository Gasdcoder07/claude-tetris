name: Issue Implement

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'claude:implementar'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidad de git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Implementar la solución y abrir PR
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ github.event.issue.number }}
            TITULO: ${{ github.event.issue.title }}
            AUTOR: ${{ github.event.issue.user.login }}
            RAMA DE TRABAJO: claude/issue-${{ github.event.issue.number }}-${{ github.run_id }}
            CUERPO:
            ${{ github.event.issue.body }}

            Implementa la solución a este issue y abre un Pull Request. Responde siempre en español.

            Antes de editar nada:
            - Lee CLAUDE.md completo y respeta sus invariantes. En particular:
              * Cada pieza de PIECES se rellena con su propio índice de color y COLORS está
                indexado desde 1 (null en la posición 0). 0 = celda vacía.
              * La rotación es por matriz (rotateCW = transponer + invertir filas); no hay
                contador de rotación. Los wall kicks son el escaneo ad-hoc [0,-1,1,-2,2].
              * Los tamaños de los canvas están hardcodeados en index.html (300x600 y 120x120):
                si cambias COLS, ROWS o BLOCK hay que actualizarlos a COLS*BLOCK x ROWS*BLOCK.
              * collide tolera y negativa (guard ny >= 0) y no vigila el borde superior.
              * El loop es start/stop: cualquier camino que detenga el juego debe llamar a
                cancelAnimationFrame(animId), y cualquier reanudación debe resetear lastTime.
              * clearLines hace splice en sitio y re-revisa el mismo índice (r++ tras eliminar).
              * El overlay es uno solo, compartido por PAUSA y GAME OVER.
            - Mantén todos los textos de interfaz en español.
            - No añadas dependencias, package.json, bundler ni framework: es JS clásico de tres
              archivos (index.html, style.css, game.js) y así debe seguir.
            - Imita el estilo del código existente (nombres, densidad de comentarios, idioma).

            Pasos:
            1. Analiza el issue y el código. Si el issue es una pregunta, un duplicado o le falta
               información esencial para implementarlo, NO cambies código: deja un comentario en el
               issue explicando por qué y qué hace falta, y termina ahí.
            2. Si es accionable, crea la rama con
               `git checkout -b claude/issue-${{ github.event.issue.number }}-${{ github.run_id }}`
               y haz el cambio mínimo y completo que resuelve el issue.
            3. Commitea con mensaje convencional, por ejemplo
               `fix: descripción corta (#${{ github.event.issue.number }})`, terminando el mensaje con:
               Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
            4. `git push -u origin claude/issue-${{ github.event.issue.number }}-${{ github.run_id }}`
            5. Abre el PR en draft:
               `gh pr create --draft --base main --head claude/issue-${{ github.event.issue.number }}-${{ github.run_id }} --title "..." --body "..."`
               El cuerpo debe incluir, en español: `Closes #${{ github.event.issue.number }}`,
               un resumen de los cambios, los invariantes de CLAUDE.md que tocaste o respetaste,
               y pasos de prueba manual (no hay tests: abrir index.html en el navegador y jugar,
               indicando qué comprobar exactamente).
               Termina el cuerpo con:
               🤖 Generated with [Claude Code](https://claude.com/claude-code)
            6. Comenta en el issue con el enlace del PR:
               `gh issue comment ${{ github.event.issue.number }} --body "..."`

            Nota: el PR queda en draft y lo revisa una persona. No lo mergees.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
